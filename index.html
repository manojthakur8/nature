<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earth Scroll Animation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:400vh;
    background:#000;
    overflow-x:hidden;
    font-family:Arial;
}

.section{
    position:sticky;
    top:0;
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.earth{
    position:relative;
    width:420px;
    height:420px;
}

.left,.right{
    position:absolute;
    width:50%;
    height:100%;
    background-image:url("https://upload.wikimedia.org/wikipedia/commons/9/97/The_Earth_seen_from_Apollo_17.jpg");
    background-size:420px 420px;
    transition:0.1s linear;
}

.left{
    left:0;
    background-position:left;
    clip-path:polygon(0 0,100% 0,100% 100%,0 100%);
}

.right{
    right:0;
    background-position:right;
    clip-path:polygon(0 0,100% 0,100% 100%,0 100%);
}

.text{
    position:absolute;
    bottom:80px;
    color:white;
    font-size:40px;
    letter-spacing:2px;
}
</style>

</head>
<body>

<div class="section">

    <div class="earth">
        <div class="left"></div>
        <div class="right"></div>
    </div>

    <div class="text">
        Scroll Down
    </div>

</div>

<script>

const left=document.querySelector(".left");
const right=document.querySelector(".right");

window.addEventListener("scroll",()=>{

let max=window.innerHeight*2;

let p=Math.min(window.scrollY/max,1);

let move=220*Math.sin(p*Math.PI);

left.style.transform=`translateX(${-move}px)`;

right.style.transform=`translateX(${move}px)`;

});

</script>

</body>
</html>
