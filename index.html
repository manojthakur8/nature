<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovely Landing Page</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;

background:linear-gradient(-45deg,
#ff0080,
#7928ca,
#00c6ff,
#00ff88,
#ffd700,
#ff4d4d);

background-size:600% 600%;

animation:bg 12s ease infinite;

}

@keyframes bg{

0%{background-position:0% 50%;}

50%{background-position:100% 50%;}

100%{background-position:0% 50%;}

}

.circle{

position:absolute;

border-radius:50%;

background:rgba(255,255,255,.2);

animation:float 10s linear infinite;

backdrop-filter:blur(10px);

}

.circle:nth-child(1){

width:200px;
height:200px;
left:5%;
top:10%;

}

.circle:nth-child(2){

width:150px;
height:150px;
right:8%;
bottom:15%;

animation-duration:8s;

}

.circle:nth-child(3){

width:100px;
height:100px;
right:20%;
top:20%;

animation-duration:12s;

}

@keyframes float{

0%{

transform:translateY(0px) rotate(0deg);

}

50%{

transform:translateY(-40px) rotate(180deg);

}

100%{

transform:translateY(0px) rotate(360deg);

}

}

.card{

position:relative;

width:700px;

max-width:90%;

padding:60px;

background:rgba(255,255,255,.15);

border-radius:30px;

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.3);

text-align:center;

color:white;

box-shadow:0 20px 50px rgba(0,0,0,.25);

animation:up 2s ease;

}

@keyframes up{

from{

transform:translateY(80px);

opacity:0;

}

to{

transform:translateY(0);

opacity:1;

}

}

h1{

font-size:55px;

margin-bottom:20px;

text-shadow:0 0 20px white;

}

p{

font-size:20px;

line-height:35px;

margin-bottom:40px;

}

button{

padding:18px 45px;

border:none;

border-radius:50px;

font-size:20px;

cursor:pointer;

background:white;

color:#333;

font-weight:bold;

transition:.4s;

box-shadow:0 0 25px white;

}

button:hover{

transform:scale(1.12);

background:#ffd700;

box-shadow:0 0 40px gold;

}

</style>

</head>

<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="card">

<h1>✨ Welcome ✨</h1>

<p>

Create Beautiful Websites With Amazing Colors,
Glass Effects, Smooth Animations and Modern Design.

</p>

<button>Get Started 🚀</button>

</div>

</body>
</html>
