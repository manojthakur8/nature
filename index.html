<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Walking Boy & Girl</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:linear-gradient(skyblue 60%,green 60%);
}

.road{
    position:absolute;
    bottom:0;
    width:100%;
    height:120px;
    background:#555;
}

.walk{
    position:absolute;
    bottom:120px;
    left:-150px;
    display:flex;
    gap:40px;
    animation:walk 12s linear infinite;
}

.person{
    text-align:center;
    animation:bounce .4s infinite alternate;
}

.face{
    width:40px;
    height:40px;
    background:#ffd39b;
    border-radius:50%;
    margin:auto;
}

.boy .body{
    width:24px;
    height:55px;
    background:#2196F3;
    margin:auto;
}

.girl .body{
    width:24px;
    height:55px;
    background:#ff4081;
    margin:auto;
}

.legs{
    width:40px;
    height:5px;
    background:black;
    margin:auto;
    transform-origin:center;
    animation:legs .4s infinite alternate;
}

@keyframes walk{
    from{left:-150px;}
    to{left:110%;}
}

@keyframes bounce{
    from{transform:translateY(0);}
    to{transform:translateY(-5px);}
}

@keyframes legs{
    from{transform:rotate(15deg);}
    to{transform:rotate(-15deg);}
}
</style>
</head>
<body>

<div class="walk">

<div class="person boy">
<div class="face"></div>
<div class="body"></div>
<div class="legs"></div>
</div>

<div class="person girl">
<div class="face"></div>
<div class="body"></div>
<div class="legs"></div>
</div>

</div>

<div class="road"></div>

</body>
</html>
