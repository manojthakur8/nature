<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fullscreen Animated Background</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
}

/* Fullscreen Background */
.bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:url("https://images.pexels.com/photos/11030301/pexels-photo-11030301.jpeg")
    center center/cover no-repeat;

    animation:
        zoom 18s ease-in-out infinite alternate,
        float 8s ease-in-out infinite;
}

/* Dark Overlay */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.25);
}

/* Content */
.content{
    position:relative;
    z-index:2;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    text-align:center;
    font-family:Arial,sans-serif;
}

.content h1{
    font-size:60px;
    text-shadow:0 5px 20px rgba(0,0,0,.6);
    animation:fadeUp 2s ease;
}

.content p{
    margin-top:15px;
    font-size:22px;
    animation:fadeUp 2.5s ease;
}

/* Animations */
@keyframes zoom{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.15);
    }
}

@keyframes float{
    0%,100%{
        filter:brightness(1);
    }
    50%{
        filter:brightness(1.08);
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>

</head>
<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="content">
    <h1>Welcome</h1>
    <p>Fullscreen Animated Background</p>
</div>

</body>
</html>
