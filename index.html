<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nature Sky Theme</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
}

.scene{
position:relative;
width:100%;
height:100vh;
background:linear-gradient(#63b8ff,#bfe9ff);
}

/* Sun */

.sun{
position:absolute;
top:60px;
right:100px;
width:100px;
height:100px;
background:#FFD54F;
border-radius:50%;
box-shadow:0 0 60px #FFD54F;
}

/* Clouds */

.cloud{
position:absolute;
width:180px;
height:60px;
background:white;
border-radius:50px;
animation:moveCloud 35s linear infinite;
}

.cloud::before,
.cloud::after{
content:"";
position:absolute;
background:white;
border-radius:50%;
}

.cloud::before{
width:70px;
height:70px;
left:20px;
top:-30px;
}

.cloud::after{
width:90px;
height:90px;
right:20px;
top:-40px;
}

.cloud1{top:80px;left:-220px;}
.cloud2{top:180px;left:-350px;animation-duration:50s;}
.cloud3{top:280px;left:-150px;animation-duration:45s;}

@keyframes moveCloud{
from{transform:translateX(0);}
to{transform:translateX(1800px);}
}

/* Birds */

.bird{
position:absolute;
font-size:30px;
animation:birdFly 18s linear infinite;
}

.b1{top:120px;}
.b2{top:180px;animation-delay:4s;}
.b3{top:250px;animation-delay:8s;}

@keyframes birdFly{
from{left:-100px;}
to{left:110%;}
}

/* Mountains */

.mountain{
position:absolute;
bottom:120px;
width:0;
height:0;
border-left:220px solid transparent;
border-right:220px solid transparent;
border-bottom:300px solid #607D8B;
}

.m1{left:-60px;}
.m2{left:220px;border-bottom-color:#546E7A;}
.m3{left:520px;}
.m4{right:-80px;}

/* Grass */

.grass{
position:absolute;
bottom:0;
width:100%;
height:140px;
background:#2E7D32;
overflow:hidden;
}

.blade{
position:absolute;
bottom:0;
width:3px;
height:60px;
background:#8BC34A;
transform-origin:bottom;
animation:wind 2s ease-in-out infinite;
}

@keyframes wind{
0%,100%{transform:rotate(-8deg);}
50%{transform:rotate(8deg);}
}

/* Text */

.text{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
color:white;
text-shadow:2px 2px 10px rgba(0,0,0,.4);
}

.text h1{
font-size:60px;
}

.text p{
font-size:22px;
margin-top:15px;
}

</style>

</head>

<body>

<div class="scene">

<div class="sun"></div>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

<div class="bird b1">🕊️</div>
<div class="bird b2">🕊️</div>
<div class="bird b3">🕊️</div>

<div class="mountain m1"></div>
<div class="mountain m2"></div>
<div class="mountain m3"></div>
<div class="mountain m4"></div>

<div class="text">
<h1>Welcome</h1>
<p>Beautiful Sky • Mountains • Birds • Wind</p>
</div>

<div class="grass" id="grass"></div>

</div>

<script>
const grass=document.getElementById("grass");

for(let i=0;i<400;i++){

let blade=document.createElement("div");

blade.className="blade";

blade.style.left=(i*5)+"px";

blade.style.height=(30+Math.random()*50)+"px";

blade.style.animationDelay=Math.random()*2+"s";

grass.appendChild(blade);

}
</script>

</body>
</html>

<div class="house">
  <div class="roof"></div>
  <div class="wall">
    <div class="door"></div>
    <div class="window left"></div>
    <div class="window right"></div>
  </div>
</div>
