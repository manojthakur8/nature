<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beautiful Nature Animation</title>

<style>

/* =======================
   RESET
======================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
}

/* =======================
   SKY
======================= */

.sky{
    width:100%;
    height:100vh;
    background:linear-gradient(#4fc3ff,#bdeeff,#ffffff);
    position:relative;
    overflow:hidden;
}

/* =======================
   SUN
======================= */

.sun{
    width:120px;
    height:120px;
    border-radius:50%;
    background:gold;
    position:absolute;
    top:40px;
    right:100px;
}

/* =======================
   CLOUDS
======================= */

.cloud{
    width:170px;
    height:60px;
    background:white;
    border-radius:50px;
    position:absolute;
}

.cloud::before{
    content:"";
    position:absolute;
    width:70px;
    height:70px;
    background:white;
    border-radius:50%;
    left:15px;
    top:-30px;
}

.cloud::after{
    content:"";
    position:absolute;
    width:90px;
    height:90px;
    background:white;
    border-radius:50%;
    right:20px;
    top:-45px;
}

.cloud1{
    top:70px;
    left:60px;
}

.cloud2{
    top:120px;
    left:420px;
}

.cloud3{
    top:60px;
    right:280px;
}

/* =======================
   RAINBOW
======================= */

.rainbow{
    width:350px;
    height:180px;
    border-radius:350px 350px 0 0;
    border-top:10px solid red;
    border-left:10px solid orange;
    border-right:10px solid yellow;
    position:absolute;
    top:120px;
    left:40%;
    transform:translateX(-50%);
}

/* =======================
   RAIN
======================= */

.rain{
    position:absolute;
    width:100%;
    height:100%;
}

.drop{
    position:absolute;
    width:2px;
    height:18px;
    background:#66ccff;
}

/* =======================
   BIRDS
======================= */

.bird{
    position:absolute;
    font-size:24px;
}

/* =======================
   MOUNTAINS
======================= */

.mountain{
    position:absolute;
    bottom:180px;
    width:0;
    height:0;
    border-left:220px solid transparent;
    border-right:220px solid transparent;
    border-bottom:320px solid #5f7f46;
}

.m1{left:-60px;}
.m2{left:220px;}
.m3{left:520px;}
.m4{left:860px;}

/* =======================
   GROUND
======================= */

.ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:180px;
    background:#4caf50;
}

/* =======================
   HOUSE
======================= */

.house{
    position:absolute;
    bottom:180px;
    left:180px;
}

.roof{
    width:0;
    height:0;
    border-left:90px solid transparent;
    border-right:90px solid transparent;
    border-bottom:70px solid brown;
}

.wall{
    width:180px;
    height:120px;
    background:#ffe4b5;
    position:relative;
}

.door{
    width:45px;
    height:70px;
    background:#6d4c41;
    position:absolute;
    bottom:0;
    left:68px;
}

.window{
    width:35px;
    height:35px;
    background:#b3ecff;
    position:absolute;
}

.w1{
    left:15px;
    top:25px;
}

.w2{
    right:15px;
    top:25px;
}

/* =======================
   TREES
======================= */

.tree{
    position:absolute;
    bottom:180px;
}

.leaves{
    width:80px;
    height:80px;
    background:green;
    border-radius:50%;
}

.trunk{
    width:18px;
    height:70px;
    background:#6d4c41;
    margin:auto;
}

.t1{left:700px;}
.t2{left:850px;}
.t3{left:1000px;}

/* =======================
   ROAD
======================= */

.road{
    position:absolute;
    bottom:60px;
    width:100%;
    height:90px;
    background:#444;
}

/* =======================
   CAR
======================= */

.car{
    position:absolute;
    bottom:90px;
    left:60px;
}

.car-body{
    width:140px;
    height:45px;
    background:red;
    border-radius:10px;
}

.car-top{
    width:70px;
    height:30px;
    background:red;
    margin-left:35px;
}

.wheel{
    width:24px;
    height:24px;
    background:black;
    border-radius:50%;
    position:absolute;
    bottom:-12px;
}

.wheel1{left:15px;}
.wheel2{right:15px;}

/* =======================
   PERSON
======================= */

.person{
    position:absolute;
    bottom:150px;
    right:180px;
}

.head{
    width:18px;
    height:18px;
    background:#ffcc99;
    border-radius:50%;
    margin:auto;
}

.body{
    width:5px;
    height:40px;
    background:black;
    margin:auto;
}

</style>

</head>

<body>

<div class="sky">

<div class="sun"></div>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

<div class="rainbow"></div>

<div class="rain"></div>

<div class="bird" style="top:80px;left:200px;">🕊️</div>
<div class="bird" style="top:140px;left:420px;">🕊️</div>
<div class="bird" style="top:100px;left:650px;">🕊️</div>

<div class="mountain m1"></div>
<div class="mountain m2"></div>
<div class="mountain m3"></div>
<div class="mountain m4"></div>

<div class="house">

<div class="roof"></div>

<div class="wall">

<div class="door"></div>

<div class="window w1"></div>

<div class="window w2"></div>

</div>

</div>

<div class="tree t1">
<div class="leaves"></div>
<div class="trunk"></div>
</div>

<div class="tree t2">
<div class="leaves"></div>
<div class="trunk"></div>
</div>

<div class="tree t3">
<div class="leaves"></div>
<div class="trunk"></div>
</div>

<div class="person">
<div class="head"></div>
<div class="body"></div>
</div>

<div class="car">

<div class="car-top"></div>

<div class="car-body">

<div class="wheel wheel1"></div>

<div class="wheel wheel2"></div>

</div>

</div>

<div class="road"></div>

<div class="ground"></div>

</div>

<script>

</body>
</html>
