<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Theme Landing Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
}

.hero{
    position:relative;
    width:100%;
    height:100vh;
    background:linear-gradient(to bottom,#5fb8ff,#dff5ff);
    overflow:hidden;
}

/* Sun */
.sun{
    position:absolute;
    top:60px;
    right:120px;
    width:120px;
    height:120px;
    background:#FFD54F;
    border-radius:50%;
    box-shadow:0 0 60px #FFD54F;
}

/* Clouds */

.cloud{
    position:absolute;
    background:white;
    border-radius:100px;
    opacity:.9;
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud1{
    width:180px;
    height:60px;
    top:100px;
    left:-250px;
    animation:cloudMove 35s linear infinite;
}

.cloud1:before{
    width:80px;
    height:80px;
    top:-35px;
    left:20px;
}

.cloud1:after{
    width:90px;
    height:90px;
    top:-40px;
    right:25px;
}

.cloud2{
    width:220px;
    height:70px;
    top:220px;
    left:-300px;
    animation:cloudMove 50s linear infinite;
    animation-delay:10s;
}

.cloud2:before{
    width:90px;
    height:90px;
    top:-40px;
    left:35px;
}

.cloud2:after{
    width:100px;
    height:100px;
    top:-45px;
    right:40px;
}

@keyframes cloudMove{
    from{transform:translateX(0);}
    to{transform:translateX(1800px);}
}

/* Birds */

.bird{
    position:absolute;
    font-size:32px;
    animation:birdFly 18s linear infinite;
}

.bird:nth-child(1){
    top:150px;
    animation-delay:0s;
}

.bird:nth-child(2){
    top:220px;
    animation-delay:4s;
}

.bird:nth-child(3){
    top:280px;
    animation-delay:8s;
}

@keyframes birdFly{
    from{
        left:-100px;
    }
    to{
        left:110%;
    }
}

/* Hero Text */

.content{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
}

.content h1{
    font-size:70px;
    text-shadow:2px 2px 10px rgba(0,0,0,.3);
}

.content p{
    font-size:22px;
    margin-top:20px;
}

button{
    margin-top:35px;
    padding:15px 40px;
    border:none;
    border-radius:40px;
    background:#fff;
    color:#2196F3;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#2196F3;
    color:white;
}

/* Snow */

.snowflake{
    position:absolute;
    top:-20px;
    color:white;
    user-select:none;
    animation:snowFall linear infinite;
}

@keyframes snowFall{
    to{
        transform:translateY(110vh);
    }
}

</style>
</head>
<body>

<div class="hero">

<div class="sun"></div>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<div class="bird">🕊️</div>
<div class="bird">🕊️</div>
<div class="bird">🕊️</div>

<div class="content">
<h1>Welcome to Sky World</h1>
<p>Beautiful Sky • Flying Birds • Snow Animation</p>
<button>Explore</button>
</div>

</div>

<script>

// Snow Effect

for(let i=0;i<120;i++){

let snow=document.createElement("div");

snow.className="snowflake";

snow.innerHTML="❄";

snow.style.left=Math.random()*100+"vw";

snow.style.fontSize=(Math.random()*12+10)+"px";

snow.style.opacity=Math.random();

snow.style.animationDuration=(Math.random()*5+5)+"s";

snow.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(snow);

}

</script>

</body>
</html>
