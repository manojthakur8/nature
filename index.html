<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nature Weather Scene</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
}

.sky{
    width:100%;
    height:100vh;
    background:linear-gradient(#5ec8ff,#dff8ff);
    position:relative;
}

/* Sun */

.sun{
    width:90px;
    height:90px;
    background:gold;
    border-radius:50%;
    position:absolute;
    top:40px;
    right:120px;
    box-shadow:0 0 40px yellow;
}

/* Clouds */

.cloud{
    position:absolute;
    width:150px;
    height:50px;
    background:white;
    border-radius:50px;
    animation:cloudMove 40s linear infinite;
}

.cloud::before,
.cloud::after{
    content:'';
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud::before{
    width:60px;
    height:60px;
    left:20px;
    top:-25px;
}

.cloud::after{
    width:80px;
    height:80px;
    right:20px;
    top:-40px;
}

.c1{
    top:80px;
    left:-180px;
}

.c2{
    top:180px;
    left:-300px;
    animation-duration:60s;
}

@keyframes cloudMove{
    from{transform:translateX(0);}
    to{transform:translateX(1700px);}
}

/* Mountains */

.mountain{
    position:absolute;
    bottom:180px;
    width:0;
    height:0;
    border-left:220px solid transparent;
    border-right:220px solid transparent;
    border-bottom:320px solid #6c7a50;
}

.m1{left:50px;}
.m2{
    left:350px;
    border-bottom-color:#556b2f;
}
.m3{
    left:700px;
}

/* Grass */

.ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:180px;
    background:#3fa34d;
}

/* House */

.house{
    position:absolute;
    bottom:180px;
    left:180px;
    width:220px;
    height:160px;
    background:#ffdb99;
}

.roof{
    position:absolute;
    top:-90px;
    left:-20px;
    width:0;
    height:0;
    border-left:130px solid transparent;
    border-right:130px solid transparent;
    border-bottom:90px solid brown;
}

.door{
    position:absolute;
    bottom:0;
    left:85px;
    width:50px;
    height:90px;
    background:#663300;
}

.window{
    position:absolute;
    width:45px;
    height:45px;
    background:#9be8ff;
    border:3px solid #555;
}

.w1{
    top:40px;
    left:20px;
}

.w2{
    top:40px;
    right:20px;
}

/* Tree */

.tree{
    position:absolute;
    bottom:180px;
    right:220px;
}

.trunk{
    width:25px;
    height:90px;
    background:#7b4f2f;
    margin:auto;
}

.leaves{
    width:90px;
    height:90px;
    background:green;
    border-radius:50%;
    margin-left:-32px;
}

/* Birds */

.bird{
    position:absolute;
    font-size:30px;
    animation:fly 18s linear infinite;
}

.b2{
    top:120px;
    animation-delay:5s;
}

.b3{
    top:160px;
    animation-delay:10s;
}

@keyframes fly{
    from{
        left:-100px;
    }
    to{
        left:110%;
    }
}

/* Wind */

.wind{
    position:absolute;
    width:120px;
    height:2px;
    background:white;
    opacity:.8;
    animation:wind 4s linear infinite;
}

.wind:nth-child(1){
    top:320px;
    left:-200px;
}

.wind:nth-child(2){
    top:360px;
    left:-350px;
    animation-delay:1s;
}

.wind:nth-child(3){
    top:420px;
    left:-500px;
    animation-delay:2s;
}

@keyframes wind{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(1800px);
    }
}

</style>

</head>

<body>

<div class="sky">

<div class="sun"></div>

<div class="cloud c1"></div>
<div class="cloud c2"></div>

<div class="bird">🕊️</div>
<div class="bird b2">🕊️</div>
<div class="bird b3">🕊️</div>

<div class="wind"></div>
<div class="wind"></div>
<div class="wind"></div>

<div class="mountain m1"></div>
<div class="mountain m2"></div>
<div class="mountain m3"></div>

<div class="house">
<div class="roof"></div>
<div class="door"></div>
<div class="window w1"></div>
<div class="window w2"></div>
</div>

<div class="tree">
<div class="leaves"></div>
<div class="trunk"></div>
</div>

<div class="ground"></div>

</div>

</body>
</html>
